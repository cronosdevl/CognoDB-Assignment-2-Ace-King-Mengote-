# Render blueprint — deploys Wayfinder as a single web service that serves both
# the API and the built SPA, so no CORS configuration is needed.
#
#   1. Push this repo to GitHub.
#   2. Render → New → Blueprint → pick the repo.
#   3. Fill in the three COGNODB_* values when prompted (they are marked sync:false
#      so they are never stored in source control).
services:
  - type: web
    name: wayfinder
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COGNODB_URI
        sync: false
      - key: COGNODB_USER
        value: cognodb
      - key: COGNODB_PASSWORD
        sync: false
      - key: COGNODB_DATABASE
        value: neo4j
